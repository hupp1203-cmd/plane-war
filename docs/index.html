<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>飞机大战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #0a0a2e;
        }
        #ui {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        #startScreen, #gameOverScreen {
            text-align: center;
            color: #fff;
            display: none;
            pointer-events: auto;
        }
        #startScreen.active, #gameOverScreen.active { display: block; }
        #startScreen h1 {
            font-size: clamp(32px, 10vw, 48px);
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 150, 255, 0.8);
        }
        #startScreen p {
            font-size: clamp(13px, 3.5vw, 16px);
            color: #88aacc;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .btn {
            background: linear-gradient(135deg, #0066ff, #0044cc);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: clamp(18px, 5vw, 22px);
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.15s;
            box-shadow: 0 4px 20px rgba(0, 100, 255, 0.4);
            pointer-events: auto;
        }
        .btn:active { transform: scale(0.95); }
        #score {
            position: absolute;
            top: 12px; left: 12px;
            color: #fff;
            font-size: clamp(16px, 4vw, 20px);
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 150, 255, 0.5);
            display: none;
            z-index: 10;
        }
        #score.active { display: block; }
        #lives {
            position: absolute;
            top: 12px; right: 12px;
            color: #ff4444;
            font-size: clamp(18px, 4.5vw, 22px);
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            display: none;
            z-index: 10;
        }
        #lives.active { display: block; }
        #highScore {
            position: absolute;
            top: 40px; left: 12px;
            color: #ffdd00;
            font-size: clamp(12px, 3.2vw, 15px);
            text-shadow: 0 0 10px rgba(255, 220, 0, 0.4);
            display: none;
            z-index: 10;
        }
        #highScore.active { display: block; }
        #gameOverScreen h1 {
            font-size: clamp(32px, 10vw, 42px);
            color: #ff4444;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            margin-bottom: 10px;
        }
        .final-score {
            font-size: clamp(24px, 7vw, 28px);
            color: #ffdd00;
            margin-bottom: 5px;
        }
        .high-score-text {
            font-size: clamp(14px, 4vw, 18px);
            color: #88ccff;
            margin-bottom: 5px;
        }
        .new-record {
            color: #ffaa00;
            font-size: clamp(16px, 4.5vw, 20px);
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div id="startScreen" class="active">
            <h1>✈ 飞机大战</h1>
            <p>触摸/鼠标控制飞机 · 自动开火<br>WASD键盘也可控制 · 击落敌机得分</p>
            <button class="btn" id="startBtn">开始游戏</button>
        </div>
        <div id="gameOverScreen">
            <h1>💥 游戏结束</h1>
            <p class="sub-text">你的得分</p>
            <p class="final-score" id="finalScore">0</p>
            <p class="high-score-text" id="highScoreText"></p>
            <p class="new-record" id="newRecord"></p>
            <button class="btn" id="restartBtn">再来一局</button>
        </div>
    </div>
    <div id="score">得分: <span id="scoreNum">0</span></div>
    <div id="lives">❤️ <span id="livesNum">3</span></div>
    <div id="highScore">🏆 最高: <span id="highScoreNum">0</span></div>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 480, H = 720;

// DOM
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const highScoreEl = document.getElementById('highScore');
const scoreNum = document.getElementById('scoreNum');
const livesNum = document.getElementById('livesNum');
const highScoreNum = document.getElementById('highScoreNum');
const finalScoreEl = document.getElementById('finalScore');
const highScoreText = document.getElementById('highScoreText');
const newRecord = document.getElementById('newRecord');

function resize() {
    var cw = document.getElementById('gameContainer').clientWidth;
    var ch = document.getElementById('gameContainer').clientHeight;
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
}
resize();
window.addEventListener('resize', resize);

function canvasPos(clientX, clientY) {
    var r = canvas.getBoundingClientRect();
    return {
        x: (clientX - r.left) / r.width * W,
        y: (clientY - r.top) / r.height * H
    };
}

// High score
function getHighScore() {
    return parseInt(localStorage.getItem('planeWarHighScore') || '0');
}
function saveHighScore(s) {
    var prev = getHighScore();
    if (s > prev) { localStorage.setItem('planeWarHighScore', s); return true; }
    return false;
}
highScoreNum.textContent = getHighScore();

// Game
var game = null;

class Game {
    constructor() {
        this.player = { x: W/2, y: H-80, w: 40, h: 50 };
        this.bullets = [];
        this.enemies = [];
        this.stars = [];
        this.explosions = [];
        this.score = 0;
        this.lives = 3;
        this.running = true;
        this.invincible = 0;
        this.frame = 0;
        this.shootTimer = 0;
        this.enemyTimer = 0;
        this.difficulty = 1;
        this.targetX = this.player.x;
        this.targetY = this.player.y;
        this.keys = {};
        this.touchId = null;

        // Stars
        for (var i = 0; i < 80; i++) {
            this.stars.push({
                x: Math.random() * W, y: Math.random() * H,
                s: Math.random() * 2 + 0.5,
                v: Math.random() * 2 + 0.5,
                b: Math.random() * 0.5 + 0.5
            });
        }
        this.bindEvents();
    }

    bindEvents() {
        // Touch
        var self = this;
        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            var p = canvasPos(e.touches[0].clientX, e.touches[0].clientY);
            self.targetX = p.x; self.targetY = p.y;
            self.touchId = e.touches[0].identifier;
        }, {passive: false});
        canvas.addEventListener('touchmove', function(e) {
            e.preventDefault();
            for (var i = 0; i < e.touches.length; i++) {
                if (e.touches[i].identifier === self.touchId) {
                    var p = canvasPos(e.touches[i].clientX, e.touches[i].clientY);
                    self.targetX = p.x; self.targetY = p.y;
                }
            }
        }, {passive: false});
        canvas.addEventListener('touchend', function(e) { self.touchId = null; });

        // Mouse
        canvas.addEventListener('mousemove', function(e) {
            var p = canvasPos(e.clientX, e.clientY);
            self.targetX = p.x; self.targetY = p.y;
        });

        // Keyboard
        window.addEventListener('keydown', function(e) {
            self.keys[e.key.toLowerCase()] = true;
            if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(e.key.toLowerCase())) {
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', function(e) {
            self.keys[e.key.toLowerCase()] = false;
        });
    }

    spawnEnemy() {
        var types = [
            {w:30,h:30,hp:1,speed:1.5+this.difficulty*0.2,c:'#ff4444',s:10},
            {w:40,h:40,hp:2,speed:1+this.difficulty*0.15,c:'#ff8800',s:20},
            {w:48,h:44,hp:3,speed:0.7+this.difficulty*0.1,c:'#cc00ff',s:30}
        ];
        var t = Math.random() < 0.6 ? types[0] : Math.random() < 0.8 ? types[1] : types[2];
        this.enemies.push({
            x: Math.random()*(W-t.w)+t.w/2, y: -t.h,
            w: t.w, h: t.h, hp: t.hp, speed: t.speed, c: t.c, score: t.s,
            vx: (Math.random()-0.5)*0.8
        });
    }

    shoot() {
        this.bullets.push({x:this.player.x-3,y:this.player.y-25,w:6,h:12,speed:8});
        this.bullets.push({x:this.player.x-3,y:this.player.y-25,w:6,h:12,speed:8});
    }

    explode(x, y, c) {
        for (var i = 0; i < 12; i++) {
            var a = Math.random()*Math.PI*2;
            var sp = Math.random()*3+1;
            this.explosions.push({
                x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
                life:25+Math.random()*20, maxLife:45,
                size:Math.random()*3+2,c:c||'#ffaa00'
            });
        }
    }

    update() {
        if (!this.running) return;
        this.frame++;
        if (this.invincible > 0) this.invincible--;

        // Movement: keyboard priority, then touch/mouse
        var kx = 0, ky = 0;
        if (this.keys['a'] || this.keys['arrowleft']) kx = -1;
        if (this.keys['d'] || this.keys['arrowright']) kx = 1;
        if (this.keys['w'] || this.keys['arrowup']) ky = -1;
        if (this.keys['s'] || this.keys['arrowdown']) ky = 1;

        if (kx !== 0 || ky !== 0) {
            this.player.x += kx * 5;
            this.player.y += ky * 5;
        } else {
            this.player.x += (this.targetX - this.player.x) * 0.12;
            this.player.y += (this.targetY - this.player.y) * 0.12;
        }
        this.player.x = Math.max(20, Math.min(W-20, this.player.x));
        this.player.y = Math.max(30, Math.min(H-30, this.player.y));

        // Shoot
        this.shootTimer++;
        if (this.shootTimer > 8) { this.shoot(); this.shootTimer = 0; }

        // Spawn
        this.enemyTimer++;
        if (this.enemyTimer > Math.max(18, 55 - this.difficulty*3)) {
            this.spawnEnemy(); this.enemyTimer = 0;
        }

        // Bullets
        for (var i = this.bullets.length-1; i >= 0; i--) {
            this.bullets[i].y -= this.bullets[i].speed;
            if (this.bullets[i].y < -20) this.bullets.splice(i,1);
        }

        // Enemies
        for (var i = this.enemies.length-1; i >= 0; i--) {
            var e = this.enemies[i];
            e.y += e.speed; e.x += e.vx;
            if (e.x < e.w/2 || e.x > W-e.w/2) e.vx *= -1;
            if (e.y > H+60) this.enemies.splice(i,1);
        }

        // Bullet-enemy collision
        for (var i = this.bullets.length-1; i >= 0; i--) {
            var b = this.bullets[i], hit = false;
            for (var j = this.enemies.length-1; j >= 0; j--) {
                var e = this.enemies[j];
                if (b.x < e.x+e.w/2 && b.x+b.w > e.x-e.w/2 &&
                    b.y < e.y+e.h/2 && b.y+b.h > e.y-e.h/2) {
                    e.hp--; hit = true;
                    if (e.hp <= 0) {
                        this.score += e.score;
                        this.explode(e.x, e.y, e.c);
                        this.enemies.splice(j,1);
                        this.difficulty = Math.min(12, 1 + Math.floor(this.score/80));
                    }
                    break;
                }
            }
            if (hit) this.bullets.splice(i,1);
        }

        // Player-enemy collision
        if (this.invincible === 0) {
            var p = this.player;
            for (var j = this.enemies.length-1; j >= 0; j--) {
                var e = this.enemies[j];
                if (p.x-p.w/2 < e.x+e.w/2 && p.x+p.w/2 > e.x-e.w/2 &&
                    p.y-p.h/2 < e.y+e.h/2 && p.y+p.h/2 > e.y-e.h/2) {
                    this.explode(p.x, p.y, '#00ccff');
                    this.explode(e.x, e.y, e.c);
                    this.enemies.splice(j,1);
                    this.lives--;
                    this.invincible = 80;
                    if (this.lives <= 0) {
                        this.running = false;
                        this.enemies = [];
                        this.bullets = [];
                    }
                    break;
                }
            }
        }

        // Explosions
        for (var i = this.explosions.length-1; i >= 0; i--) {
            var ex = this.explosions[i];
            ex.x += ex.vx; ex.y += ex.vy;
            ex.vy += 0.04; ex.life--;
            if (ex.life <= 0) this.explosions.splice(i,1);
        }

        // Stars
        for (var s of this.stars) {
            s.y += s.v;
            if (s.y > H) { s.y = 0; s.x = Math.random()*W; }
        }

        scoreNum.textContent = this.score;
        livesNum.textContent = this.lives;
    }

    draw() {
        ctx.fillStyle = '#0a0a2e';
        ctx.fillRect(0, 0, W, H);

        // Stars
        for (var s of this.stars) {
            var a = s.b * (0.6+0.4*Math.sin(this.frame*0.02+s.x));
            ctx.fillStyle = 'rgba(200,220,255,'+a+')';
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.s, 0, Math.PI*2);
            ctx.fill();
        }

        // Bullets
        for (var b of this.bullets) {
            var g = ctx.createLinearGradient(b.x,b.y,b.x+b.w,b.y+b.h);
            g.addColorStop(0,'#00ffff'); g.addColorStop(1,'#0088ff');
            ctx.fillStyle = g;
            ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 6;
            ctx.fillRect(b.x,b.y,b.w,b.h);
            ctx.shadowBlur = 0;
        }

        // Enemies
        for (var e of this.enemies) {
            ctx.shadowColor = e.c; ctx.shadowBlur = 8;
            ctx.fillStyle = e.c;
            ctx.beginPath();
            ctx.moveTo(e.x, e.y-e.h/2);
            ctx.lineTo(e.x-e.w/2, e.y+e.h/4);
            ctx.lineTo(e.x-e.w/4, e.y+e.h/2);
            ctx.lineTo(e.x+e.w/4, e.y+e.h/2);
            ctx.lineTo(e.x+e.w/2, e.y+e.h/4);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.ellipse(e.x, e.y-e.h/6, e.w/6, e.h/5, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // Player
        if (this.running) {
            var p = this.player;
            if (this.invincible > 0 && Math.floor(this.invincible/6)%2 === 0) {
                ctx.globalAlpha = 0.4;
            }
            ctx.shadowColor = '#00ccff'; ctx.shadowBlur = 15;
            var g = ctx.createLinearGradient(p.x,p.y-p.h/2,p.x,p.y+p.h/2);
            g.addColorStop(0,'#00ccff'); g.addColorStop(1,'#0066ff');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y-p.h/2);
            ctx.lineTo(p.x-p.w/2, p.y+p.h/6);
            ctx.lineTo(p.x-p.w/3, p.y+p.h/4);
            ctx.lineTo(p.x-p.w/4, p.y+p.h/2);
            ctx.lineTo(p.x, p.y+p.h/3);
            ctx.lineTo(p.x+p.w/4, p.y+p.h/2);
            ctx.lineTo(p.x+p.w/3, p.y+p.h/4);
            ctx.lineTo(p.x+p.w/2, p.y+p.h/6);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = 'rgba(100,200,255,0.4)';
            ctx.beginPath();
            ctx.ellipse(p.x, p.y-p.h/6, p.w/7, p.h/6, 0, 0, Math.PI*2);
            ctx.fill();
            // Engine glow
            ctx.fillStyle = 'rgba(255,150,0,0.5)';
            ctx.beginPath();
            ctx.ellipse(p.x-p.w/5, p.y+p.h/3, 3, 7, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(p.x+p.w/5, p.y+p.h/3, 3, 7, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        // Explosions
        for (var ex of this.explosions) {
            var a = ex.life/ex.maxLife;
            ctx.globalAlpha = a;
            ctx.fillStyle = ex.c;
            ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.arc(ex.x, ex.y, ex.size*(1+(1-a)*0.5), 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }
    }

    loop() {
        this.update();
        this.draw();
        if (!this.running && this.explosions.length === 0) {
            cancelAnimationFrame(this.animId);
            showGameOver(this.score);
            return;
        }
        this.animId = requestAnimationFrame(this.loop.bind(this));
    }
}

function showGameOver(score) {
    var isNew = saveHighScore(score);
    scoreEl.classList.remove('active');
    livesEl.classList.remove('active');
    highScoreEl.classList.remove('active');
    gameOverScreen.classList.add('active');
    finalScoreEl.textContent = score;
    highScoreText.textContent = '🏆 最高分: ' + getHighScore();
    newRecord.textContent = isNew ? '🎉 新纪录！' : '';
    highScoreNum.textContent = getHighScore();
}

function startGame() {
    if (game) {
        if (game.animId) cancelAnimationFrame(game.animId);
    }
    startScreen.classList.remove('active');
    gameOverScreen.classList.remove('active');
    scoreEl.classList.add('active');
    livesEl.classList.add('active');
    highScoreEl.classList.add('active');
    scoreNum.textContent = '0';
    livesNum.textContent = '3';
    game = new Game();
    game.loop();
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);
</script>
</body>
</html>
